name: Deploy → Live

# Triggered by tagging a release, e.g. `v1.0.0`.
# GitHub Environment Protection Rules (set in repo Settings) require
# manual approval from Engineering Lead + Product Owner before this
# job runs.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to muqsit.sa
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://muqsit.sa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="postgresql://placeholder@localhost:5432/x" pnpm --filter @muqsit/database db:generate

      # Critical: backup before any migration runs against production.
      - name: Snapshot production database
        run: |
          echo "::notice::Take a Postgres snapshot before deploy."
          # In Vercel Postgres / Neon: use their managed snapshot CLI.
          # Skipped here — wire to your provider's snapshot command.

      - name: Apply migrations to production database
        run: pnpm --filter @muqsit/database db:deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
